name: GeoEnglish - Daily 09:00 TRT
on:
  schedule:
    - cron: '0 6 * * *' # 09:00 Europe/Istanbul (UTC+3)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional manual topic; leave empty for curriculum'
        required: false
        type: string
      level:
        description: 'Level for manually specified topic'
        required: false
        default: A1
        type: choice
        options: [A1, A2, B1, B2, C1]
permissions:
  contents: write
concurrency:
  group: geoenglish-daily
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate and validate lesson
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MANUAL_TOPIC: ${{ inputs.topic }}
          MANUAL_LEVEL: ${{ inputs.level }}
        run: |
          if [ -n "$MANUAL_TOPIC" ]; then
            python scripts/generate_lesson.py --topic "$MANUAL_TOPIC" --level "${MANUAL_LEVEL:-A1}"
          else
            python scripts/generate_lesson.py
          fi
          python -m unittest discover -s tests -v
      - name: Commit new content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lessons-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish new GeoEnglish lesson'
            git pull --rebase
            git push
          fi
